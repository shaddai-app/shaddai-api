name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todo el historial: un secreto borrado después igual quedó commiteado
      - name: Buscar secretos commiteados (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner

  migrations:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Strong-Passw0rd
          MSSQL_PID: Developer
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Strong-Passw0rd -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: '1433'
      DB_NAME: Shaddai
      DB_USER: sa
      DB_PASSWORD: Ci-Strong-Passw0rd
      DB_ENCRYPT: 'true'
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      NODE_ENV: test
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret-ci-secret-ci-secret
      TOTP_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEED_SUPERADMIN_EMAIL: ci@shaddai.local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Crear base desde cero con migraciones + seed
        run: npm run db:setup
      - name: El seed es idempotente
        run: npm run db:seed
      - name: Sin drift entre la base migrada y el schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - name: Tests de integración (base Shaddai_test)
        run: npm run test:int
